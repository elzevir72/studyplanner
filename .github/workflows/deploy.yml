name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-northeast-2
  STAGE: prod

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    outputs:
      bucket: ${{ steps.outputs.outputs.bucket }}
      distribution_id: ${{ steps.outputs.outputs.distribution_id }}
      api_url: ${{ steps.outputs.outputs.api_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install serverless framework
        working-directory: infra
        run: npm install

      - name: Install backend dependencies into package
        run: pip install -r backend/requirements.txt -t backend/vendor

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend (Lambda + API Gateway + DynamoDB + S3/CloudFront resources)
        working-directory: infra
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npx serverless deploy --stage ${{ env.STAGE }}

      - name: Read stack outputs
        id: outputs
        working-directory: infra
        run: |
          BUCKET=$(npx serverless info --stage ${{ env.STAGE }} --verbose | grep FrontendBucketName | awk '{print $2}')
          DIST_ID=$(npx serverless info --stage ${{ env.STAGE }} --verbose | grep FrontendDistributionId | awk '{print $2}')
          API_URL=$(npx serverless info --stage ${{ env.STAGE }} --verbose | grep ApiUrl | awk '{print $2}')
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.api_url }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync build to S3
        run: aws s3 sync frontend/dist s3://${{ needs.deploy-backend.outputs.bucket }} --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ needs.deploy-backend.outputs.distribution_id }} --paths "/*"
